<script type="module">
import * as THREE from 'three';

/* ---------- renderer ---------- */
const RT_W = 1600, RT_H = 900;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);

// Two render targets, ping-ponged: the laptop screen samples last frame's image.
const makeRT = () => {
  const rt = new THREE.WebGLRenderTarget(RT_W, RT_H, { samples: 4, generateMipmaps: true,
    minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter });
  rt.texture.colorSpace = THREE.SRGBColorSpace;
  rt.texture.anisotropy = 8;
  return rt;
};
const rtMain = makeRT(), rtInner = makeRT();

/* ---------- scene ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14110f);
const camera = new THREE.PerspectiveCamera(40, RT_W / RT_H, 0.1, 50);

const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, metalness: 0, ...o });
const box = (w, h, d, m, x = 0, y = 0, z = 0, parent = scene) => {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.position.set(x, y, z); mesh.castShadow = mesh.receiveShadow = true;
  parent.add(mesh); return mesh;
};

// Room
const wallM = mat(0xe8dfd2), floorM = mat(0x9a7a5a, { roughness: 0.6 }), ceilM = mat(0xf4efe8);
const RW = 5, RH = 4.2, ZB = -3.2, ZF = 7;
const floor = box(RW * 2, 0.1, ZF - ZB, floorM, 0, -0.05, (ZF + ZB) / 2);
box(RW * 2, 0.1, ZF - ZB, ceilM, 0, RH + 0.05, (ZF + ZB) / 2);
box(RW * 2, RH, 0.1, wallM, 0, RH / 2, ZB - 0.05);
box(0.1, RH, ZF - ZB, mat(0xdcd0bf), -RW - 0.05, RH / 2, (ZF + ZB) / 2);
box(0.1, RH, ZF - ZB, mat(0xdcd0bf), RW + 0.05, RH / 2, (ZF + ZB) / 2);
box(RW * 2, 0.25, 0.06, mat(0xb9a98f), 0, 0.125, ZB + 0.03); // skirting
// rug
box(5.2, 0.02, 3.6, mat(0x4a5a6a), 0, 0.01, -0.2);
box(4.8, 0.025, 3.2, mat(0x5a6e80), 0, 0.012, -0.2);

// Window (back wall, left) with warm daylight
const winG = new THREE.Group(); winG.position.set(-2.9, 2.5, ZB + 0.02); scene.add(winG);
box(1.9, 1.6, 0.06, mat(0xf2ece2), 0, 0, 0, winG);
box(1.7, 1.4, 0.04, new THREE.MeshBasicMaterial({ color: 0xbfe0f5 }), 0, 0, 0.03, winG);
box(0.06, 1.4, 0.05, mat(0xf2ece2), 0, 0, 0.05, winG);
box(1.7, 0.06, 0.05, mat(0xf2ece2), 0, 0, 0.05, winG);

// Wall picture: pixel Clawd on a canvas
const pic = document.createElement('canvas'); pic.width = pic.height = 64;
{
  const g = pic.getContext('2d'); g.fillStyle = '#2b2622'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#d97757';
  g.fillRect(12, 22, 40, 22); g.fillRect(6, 28, 6, 8); g.fillRect(52, 28, 6, 8);
  for (const x of [14, 22, 38, 46]) g.fillRect(x, 44, 4, 8);
  g.fillStyle = '#1a1511'; g.fillRect(22, 28, 4, 8); g.fillRect(38, 28, 4, 8);
}
const picTex = new THREE.CanvasTexture(pic); picTex.colorSpace = THREE.SRGBColorSpace; picTex.magFilter = THREE.NearestFilter;
const frame = new THREE.Group(); frame.position.set(2.9, 2.6, ZB + 0.03); scene.add(frame);
box(1.3, 1.3, 0.05, mat(0x3a2e24), 0, 0, 0, frame);
const pm = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 1.1), new THREE.MeshBasicMaterial({ map: picTex }));
pm.position.z = 0.03; frame.add(pm);

// Shelf + plant
box(1.6, 0.06, 0.4, mat(0x6b4f3a), 3.6, 1.7, ZB + 0.25);
for (const [i, c] of [0xc9573b, 0x5b7c99, 0xe0b04a, 0x7b9a6b].entries()) box(0.14, 0.4 - i * 0.03, 0.28, mat(c), 3.1 + i * 0.17, 1.93 - i * 0.015, ZB + 0.25);
const plant = new THREE.Group(); plant.position.set(-4.0, 0, -1.8); scene.add(plant);
{
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.24, 0.5, 14), mat(0xb5654a)); pot.position.y = 0.25; pot.castShadow = true; plant.add(pot);
  const lm = mat(0x4f8a4a);
  for (let i = 0; i < 9; i++) {
    const l = new THREE.Mesh(new THREE.SphereGeometry(0.28, 10, 8), lm);
    const a = i * 2.4; l.position.set(Math.cos(a) * 0.28, 0.85 + (i % 3) * 0.3, Math.sin(a) * 0.28);
    l.scale.set(1, 1.5, 0.5); l.rotation.y = -a; l.castShadow = true; plant.add(l);
  }
}

// Desk
const woodM = mat(0xb98a5e, { roughness: 0.55 }), darkWood = mat(0x7a5638);
const DESK_Y = 0.95, DESK_Z = -0.05;
box(3.6, 0.1, 1.9, woodM, 0, DESK_Y - 0.05, DESK_Z);
for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(0.12, DESK_Y - 0.1, 0.12, darkWood, sx * 1.65, (DESK_Y - 0.1) / 2, DESK_Z + sz * 0.8);
box(3.3, 0.5, 0.06, darkWood, 0, DESK_Y - 0.4, DESK_Z - 0.85);

// Chair
box(1.4, 0.12, 1.1, mat(0x3b4a5a), 0, 0.72, -1.5);
box(1.4, 1.8, 0.12, mat(0x3b4a5a), 0, 1.6, -2.1);
box(0.1, 0.7, 0.1, mat(0x222), 0, 0.36, -1.5);
box(1.0, 0.06, 1.0, mat(0x222), 0, 0.03, -1.5);

// Lamp + mug on desk
{
  const lamp = new THREE.Group(); lamp.position.set(1.5, DESK_Y, -0.55); scene.add(lamp);
  box(0.4, 0.04, 0.4, mat(0x2a2a2a), 0, 0.02, 0, lamp);
  box(0.05, 0.9, 0.05, mat(0x2a2a2a), 0, 0.47, 0, lamp);
  const shade = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.3, 16, 1, true), new THREE.MeshStandardMaterial({ color: 0xf0a24a, side: THREE.DoubleSide, emissive: 0xf0a24a, emissiveIntensity: 0.6 }));
  shade.position.set(0, 0.95, 0); shade.castShadow = true; lamp.add(shade);
  const pl = new THREE.PointLight(0xffb866, 6, 5, 2); pl.position.set(0, 0.85, 0.05); lamp.add(pl);
  const mug = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.12, 0.2, 14), mat(0xf4f0e8)); mug.position.set(-1.5, DESK_Y + 0.1, 0.15); mug.castShadow = true; scene.add(mug);
  box(0.05, 0.1, 0.04, mat(0xf4f0e8), -1.37, DESK_Y + 0.1, 0.15);
}

// Lights
scene.add(new THREE.HemisphereLight(0xfff3e0, 0x8a7560, 1.5));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.2);
sun.position.set(-4, 7, 5); sun.target.position.set(0, 1, -0.5);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 20 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
const screenGlow = new THREE.PointLight(0x9fc8ff, 0, 4, 2); scene.add(screenGlow);

/* ---------- mascot (Clawd) ---------- */
const ORANGE = 0xd97757, DARKO = 0xb85f42;
const clawd = new THREE.Group(); clawd.position.set(0, 0, -1.35); scene.add(clawd);
const body = new THREE.Group(); body.position.y = 1.85; clawd.add(body);
const bodyM = mat(ORANGE, { roughness: 0.7 }), shadeM = mat(DARKO, { roughness: 0.7 });
box(1.6, 0.95, 0.8, bodyM, 0, 0, 0, body);
box(1.6, 0.06, 0.82, shadeM, 0, -0.45, 0, body);
const eyeM = new THREE.MeshStandardMaterial({ color: 0x15100d, roughness: 0.3 });
const eyes = [-0.38, 0.38].map(x => box(0.14, 0.26, 0.03, eyeM, x, 0.08, 0.41, body));
// legs (four short stubs, resting on the seat)
for (const x of [-0.6, -0.2, 0.2, 0.6]) box(0.2, 0.5, 0.22, shadeM, x, -0.78, 0.08, body);

// arms: shoulder pivot, stretchy stub pointing at a target, plus a hand block
function makeArm(side) {
  const pivot = new THREE.Group(); pivot.position.set(side * 0.78, -0.05, 0.15); body.add(pivot);
  const seg = new THREE.Group(); pivot.add(seg);
  const m = box(0.26, 0.24, 1, bodyM, 0, 0, 0.5, seg);
  const hand = box(0.32, 0.26, 0.3, shadeM, 0, 0, 1, seg);
  return { pivot, seg, m, hand, side };
}
const arms = [makeArm(-1), makeArm(1)];
const tmpV = new THREE.Vector3(), tmpL = new THREE.Vector3();
function aimArm(a, worldTarget) {
  a.pivot.updateWorldMatrix(true, false);
  const p = a.pivot.getWorldPosition(tmpV.set(0, 0, 0)).clone();
  const dir = worldTarget.clone().sub(p); const len = dir.length();
  // convert to body-local and orient the segment
  const local = body.worldToLocal(worldTarget.clone());
  a.seg.lookAt(local.sub(a.pivot.position).add(a.pivot.position));
  const s = Math.max(len - 0.1, 0.2);
  a.m.scale.z = s; a.m.position.z = s / 2; a.hand.position.z = s;
}

/* ---------- laptop ---------- */
const lap = new THREE.Group(); scene.add(lap);
const LAP_HOME = new THREE.Vector3(0, DESK_Y, -0.1);
const alu = mat(0xc3c6cc, { metalness: 0.7, roughness: 0.35 });
box(1.62, 0.06, 1.1, alu, 0, 0.03, 0, lap);
// keyboard texture
const kc = document.createElement('canvas'); kc.width = 512; kc.height = 300;
{
  const g = kc.getContext('2d'); g.fillStyle = '#26282c'; g.fillRect(0, 0, 512, 300);
  g.fillStyle = '#3a3d43';
  for (let r = 0; r < 5; r++) for (let c = 0; c < 14; c++) g.fillRect(14 + c * 34.5, 14 + r * 36, 29, 30);
  g.fillRect(100, 196, 300, 30);
}
const kt = new THREE.CanvasTexture(kc); kt.colorSpace = THREE.SRGBColorSpace;
const kb = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.6), new THREE.MeshStandardMaterial({ map: kt, roughness: 0.6 }));
kb.rotation.x = -Math.PI / 2; kb.position.set(0, 0.062, -0.12); kb.receiveShadow = true; lap.add(kb);
box(0.5, 0.005, 0.3, mat(0xaaadb3), 0, 0.063, 0.33, lap);

const lid = new THREE.Group(); lid.position.set(0, 0.06, 0.53); lid.rotation.x = 0.42; lap.add(lid);
box(1.62, 0.92, 0.05, alu, 0, 0.46, 0, lid);
// logo on the back of the lid
box(0.2, 0.14, 0.01, new THREE.MeshStandardMaterial({ color: ORANGE, emissive: ORANGE, emissiveIntensity: 0.5 }), 0, 0.46, 0.03, lid);
const screenMat = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false, map: rtInner.texture });
const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.844), screenMat);
screen.rotation.y = Math.PI; screen.position.set(0, 0.47, -0.032); lid.add(screen);
// bezel
box(1.58, 0.9, 0.004, mat(0x0c0c0e), 0, 0.47, -0.026, lid);
const grabL = new THREE.Object3D(), grabR = new THREE.Object3D();
lap.add(grabL, grabR);

/* ---------- animation timeline ---------- */
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const sm = (t, a, b) => ease(Math.min(Math.max((t - a) / (b - a), 0), 1));
// macro timeline (seconds): type -> grab -> turn the laptop -> zoom into the screen -> hand over, loop
const T = { typeEnd: 2.2, grabEnd: 2.8, turnEnd: 4.0, zoomStart: 3.7, loop: 4.9 };

const camA = { pos: new THREE.Vector3(0.8, 3.0, 5.2), look: new THREE.Vector3(0, 1.45, -0.3) };
const UP = new THREE.Vector3(0, 1, 0);
const _m = new THREE.Matrix4(), _qa = new THREE.Quaternion(), _qb = new THREE.Quaternion(), _sq = new THREE.Quaternion();
const _p = new THREE.Vector3(), _l = new THREE.Vector3(), _c = new THREE.Vector3(), _n = new THREE.Vector3(),
      _u = new THREE.Vector3(), _o = new THREE.Vector3(), _ax = new THREE.Vector3(), _tp = new THREE.Vector3();

// small, clamped drag-to-look (eases back when released)
let dragYaw = 0, dragPitch = 0, tYaw = 0, tPitch = 0, dragging = false, lastX = 0, lastY = 0;
const cv = renderer.domElement; cv.style.touchAction = 'none'; cv.style.cursor = 'grab';
cv.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; });
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  tYaw = THREE.MathUtils.clamp(tYaw - (e.clientX - lastX) * 0.0006, -0.16, 0.16);
  tPitch = THREE.MathUtils.clamp(tPitch + (e.clientY - lastY) * 0.0004, -0.06, 0.08);
  lastX = e.clientX; lastY = e.clientY;
});
const endDrag = () => { dragging = false; tYaw = tPitch = 0; cv.style.cursor = 'grab'; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// flying code bits: the clearest "it's typing" cue
const partGroup = new THREE.Group(); scene.add(partGroup);
const parts = []; let partIdx = 0;
{
  const g = new THREE.BoxGeometry(1, 1, 1);
  [0xd97757, 0xffffff, 0x7fc4ff, 0xffd36b].forEach(c => { for (let i = 0; i < 10; i++) {
    const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: c })); m.visible = false;
    m.userData = { life: 0, s: 0.07, vel: new THREE.Vector3() }; partGroup.add(m); parts.push(m);
  } });
}
function spawnPart() {
  const m = parts[partIdx++ % parts.length], u = m.userData;
  m.visible = true; u.life = 1; u.s = 0.05 + Math.random() * 0.07; m.scale.setScalar(0.001);
  m.position.set(lap.position.x + (Math.random() - 0.5) * 1.1, lap.position.y + 0.95, lap.position.z + 0.65);
  u.vel.set((Math.random() - 0.5) * 0.6, 1.1 + Math.random() * 0.9, 0.3 + Math.random() * 0.7);
}
function stepParts(dt) {
  for (const m of parts) {
    if (!m.visible) continue; const u = m.userData; u.life -= dt * 1.1;
    if (u.life <= 0) { m.visible = false; continue; }
    u.vel.y -= 1.3 * dt; m.position.addScaledVector(u.vel, dt);
    m.scale.setScalar(u.s * Math.min(1, u.life * 2)); m.rotation.y += dt * 4; m.rotation.x += dt * 3;
  }
}

const hT = [new THREE.Vector3(), new THREE.Vector3()];
let tapBeat = -1;
const sound = makeSound();

// Sets every object to the pose for macro time t; `time` drives the continuous micro-motion.
function pose(t, time, live) {
  const hold = sm(t, T.typeEnd, T.grabEnd);          // hands move to the laptop sides
  const rotP = sm(t, T.grabEnd, T.turnEnd);          // laptop turns toward the camera
  const typing = 1 - hold;
  const retract = sm(t, T.zoomStart + 0.1, T.loop - 0.2);

  lap.position.set(LAP_HOME.x, LAP_HOME.y + rotP * 0.25, LAP_HOME.z + rotP * 0.5);
  lap.rotation.y = rotP * Math.PI;
  lap.scale.setScalar(1 + rotP * 0.22);
  lid.rotation.x = 0.42 - rotP * 0.1;
  clawd.position.z = -1.35 + rotP * 0.3;             // lean in to the desk, no sideways travel

  // typing: fast alternating key strokes
  const beat = time * 9;
  if (live && typing > 0.9 && Math.floor(beat) !== tapBeat) { tapBeat = Math.floor(beat); sound.click(); spawnPart(); }
  const tapA = Math.pow(Math.max(0, Math.sin(beat * Math.PI * 0.5)), 2);
  const tapB = Math.pow(Math.max(0, Math.sin(beat * Math.PI * 0.5 + Math.PI / 2 + 0.6)), 2);
  const wob = [Math.sin(time * 5.3) * 0.1, Math.cos(time * 4.1) * 0.1];
  const push = Math.sin(rotP * Math.PI) * 0.3;

  lap.updateWorldMatrix(true, true);
  for (let i = 0; i < 2; i++) {
    const s = i === 0 ? -1 : 1;
    const key = new THREE.Vector3(s * (0.35 + wob[i]), DESK_Y + 0.22 - (i ? tapB : tapA) * 0.12, -0.55 + wob[1 - i] * 0.5);
    const side = new THREE.Vector3(s * (0.81 * lap.scale.x + 0.17), lap.position.y + 0.2, lap.position.z - s * push);
    const away = new THREE.Vector3(s * 0.95, 1.4, clawd.position.z + 0.2);   // hands pull back out of the shot
    side.lerp(away, retract);
    hT[i].lerpVectors(key, side, hold);
  }
  body.updateWorldMatrix(true, true);
  aimArm(arms[0], hT[0]); aimArm(arms[1], hT[1]);

  // body life: breathing, typing bob and head-nod, blink
  const breath = Math.sin(time * 2.2);
  body.scale.set(1 + breath * 0.008, 1 + breath * 0.018, 1);
  body.position.y = 1.85 + breath * 0.012 + typing * Math.abs(Math.sin(beat * Math.PI * 0.5)) * 0.03;
  body.rotation.z = Math.sin(time * 0.9) * 0.012 + typing * Math.sin(beat * Math.PI * 0.5) * 0.02;
  body.rotation.x = 0.07 * typing + 0.03 * hold;
  body.rotation.y = 0;
  const blink = (time % 3.1) > 3.0 ? 0.1 : 1;
  eyes.forEach(e => { e.scale.y = blink; e.position.y = 0.08 - typing * 0.03; });

  screenGlow.position.set(0, lap.position.y + 0.5, lap.position.z - 0.05);
  screenGlow.intensity = 1.6 * (1 - rotP);
  return rotP;
}

function setMainCamera(time, z) {
  _p.set(camA.pos.x + Math.sin(time * 0.25) * 0.04, camA.pos.y + Math.sin(time * 0.31) * 0.02, camA.pos.z);
  _l.copy(camA.look);
  const w = 1 - z;                                   // drag fades out as we dive into the screen
  _o.copy(_p).sub(_l).applyAxisAngle(UP, dragYaw * w);
  _ax.crossVectors(UP, _o).normalize(); _o.applyAxisAngle(_ax, dragPitch * w);
  _p.copy(_l).add(_o);
  _m.lookAt(_p, _l, UP); _qa.setFromRotationMatrix(_m);
  if (z > 0) {
    // pose that frames the screen exactly edge to edge, front-on
    scene.updateMatrixWorld();
    screen.getWorldPosition(_c); screen.getWorldQuaternion(_sq);
    _n.set(0, 0, 1).applyQuaternion(_sq); _u.set(0, 1, 0).applyQuaternion(_sq);
    const d = (0.844 * lap.scale.x / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    _tp.copy(_c).addScaledVector(_n, d);
    _m.lookAt(_tp, _c, _u); _qb.setFromRotationMatrix(_m);
    _p.lerp(_tp, z); _qa.slerp(_qb, z);
  }
  camera.position.copy(_p); camera.quaternion.copy(_qa);
}

/* ---------- render loop ---------- */
// Pass 1 renders the scene at the START of the loop (typing) into rtInner.
// Pass 2 renders the real timeline, with rtInner on the laptop screen. The camera zooms
// until the screen fills the frame; the loop then restarts on exactly that image.
const blitScene = new THREE.Scene();
const blitCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const blitMat = new THREE.MeshBasicMaterial({ toneMapped: false, map: rtMain.texture });
const blit = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blitMat);
blitScene.add(blit);
function fitBlit() {
  const a = innerWidth / innerHeight, r = RT_W / RT_H;
  if (a > r) blit.scale.set(r / a, 1, 1); else blit.scale.set(1, a / r, 1);
}
fitBlit();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); fitBlit(); });

let prev = performance.now();
let time = parseFloat(new URLSearchParams(location.search).get('t')) || 0;
let macro = time % T.loop;

function frame_() {
  const now = performance.now(), dt = Math.min((now - prev) / 1000, 0.05); prev = now;
  time += dt; macro += dt;
  if (macro >= T.loop) macro -= T.loop;               // hand-over: identical to the zoomed-in image
  const k = 1 - Math.exp(-dt * 6);
  dragYaw += (tYaw - dragYaw) * k; dragPitch += (tPitch - dragPitch) * k;

  // pass 1: inner image
  partGroup.visible = false; screen.visible = false;
  pose(0, time, false);
  { const y = dragYaw, pch = dragPitch; dragYaw = dragPitch = 0; setMainCamera(time, 0); dragYaw = y; dragPitch = pch; } // ignore drag so the hand-over matches
  renderer.setRenderTarget(rtInner); renderer.render(scene, camera);

  // pass 2: real timeline
  partGroup.visible = true; screen.visible = true; stepParts(dt);
  const rotP = pose(macro, time, true);
  setMainCamera(time, sm(macro, T.zoomStart, T.loop));
  if (rotP > 0.02 && rotP < 0.98) sound.whoosh(rotP); else sound.idle();
  renderer.setRenderTarget(rtMain); renderer.render(scene, camera);

  renderer.setRenderTarget(null);
  renderer.render(blitScene, blitCam);
  requestAnimationFrame(frame_);
}
frame_();

/* ---------- sound (starts after first user gesture; no UI) ---------- */
function makeSound() {
  let ctx = null, master = null, noiseBuf = null, whooshNode = null;
  const start = () => {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC(); master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // soft ambient pad
    for (const f of [110, 164.8, 220]) {
      const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.value = 0.012;
      o.connect(g).connect(master); o.start();
    }
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 600; bp.Q.value = 0.7;
    const g = ctx.createGain(); g.gain.value = 0; src.connect(bp).connect(g).connect(master); src.start();
    whooshNode = { g, bp };
  };
  for (const ev of ['pointerdown', 'keydown', 'touchstart']) addEventListener(ev, start, { passive: true });
  return {
    click() {
      if (!ctx || ctx.state !== 'running') return;
      const s = ctx.createBufferSource(); s.buffer = noiseBuf;
      const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1800 + Math.random() * 1500;
      const g = ctx.createGain(); const n = ctx.currentTime;
      g.gain.setValueAtTime(0.18, n); g.gain.exponentialRampToValueAtTime(0.001, n + 0.04);
      s.connect(f).connect(g).connect(master); s.start(n, Math.random() * 0.5, 0.05);
    },
    whoosh(p) { if (whooshNode) { whooshNode.g.gain.value = 0.05 * Math.sin(Math.PI * p); whooshNode.bp.frequency.value = 300 + 700 * p; } },
    idle() { if (whooshNode) whooshNode.g.gain.value = 0; },
  };
}
</script>
